name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml so a tag can't ship with failing tests

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Format
        # Windows checkouts may turn line endings into CRLF, which gofmt reports
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -s -l .)" || (echo "gofmt needed:"; gofmt -s -l .; exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build and run
        run: |
          go build ./cmd/lazyunity
          go run ./cmd/lazyunity --version

  # Builds every release archive and the Scoop and WinGet manifests, publishing
  # nothing, so a broken .goreleaser.yaml shows up before a tag does.
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2 # an exact release, not "latest": the binary is not pinned by the action's SHA
          args: release --snapshot --clean
